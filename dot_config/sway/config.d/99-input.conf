# Touchpad tuning: faster pointer movement and natural/inverted scrolling.
input "type:touchpad" {
    pointer_accel 0.3
    natural_scroll enabled
}

# Keyboard: Left Ctrl = Esc, Caps Lock = Ctrl (symbols in ~/.config/xkb/symbols/lctl_esc).
input "type:keyboard" {
    xkb_file ~/.config/sway/keymap.xkb
}
