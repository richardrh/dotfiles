# Local Sway defaults.
# Pixel borders remove the title bar above tiled windows.
default_border pixel 2
default_floating_border pixel 2

gaps inner 0
gaps outer 0

# 2.5 on the 2880x1800 panel = 1152x720 logical desktop.
output * scale 2.5

input "type:touchpad" {
    pointer_accel 0.4
    natural_scroll enabled
}
