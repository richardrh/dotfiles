# Local Sway defaults.
# Pixel borders remove the title bar above tiled windows.
default_border none
default_floating_border none

gaps inner 0
gaps outer 0

# 2.5 on the 2880x1800 panel = 1152x720 logical desktop.
output * scale 2.5

input "type:touchpad" {
    pointer_accel 0.4
    natural_scroll enabled
}

# Keep the personal Catppuccin pink border palette.
client.focused          #cba6f7 #1e1e2e #cdd6f4 #89b4fa #cba6f7
client.focused_inactive #6c7086 #1e1e2e #bac2de #6c7086 #6c7086
client.unfocused        #45475a #1e1e2e #a6adc8 #45475a #45475a

# Explicit workspace bindings, independent of distro drop-ins.
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4

# Remove Sway's title decoration from Chromium windows, including existing rules.
for_window [app_id="org.chromium.Chromium"] border none
