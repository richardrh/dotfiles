# Use split tiling and titlebar-free borders when a browser window opens.
# Covers native Wayland app IDs and XWayland WM_CLASS values.
set $browser_windows (?i)^(org\.chromium\.Chromium|chromium|chromium-browser|google-chrome|org\.mozilla\.firefox|firefox|firefox-esr|com\.brave\.Browser|brave-browser|com\.microsoft\.Edge|microsoft-edge)$
for_window [app_id="$browser_windows"] layout splith, border pixel 2
for_window [class="$browser_windows"] layout splith, border pixel 2
