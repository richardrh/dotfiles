# Noctalia replaces Waybar, notifications, launcher, lock screen and wallpaper.
# Waybar's user service is masked; Sway's built-in bar is disabled in 90-bar.conf.
exec noctalia

# Fedora's sway config spawns swaybg with a static default image on every
# (re)load, which covers Noctalia's wallpaper. Kill it once it has started.
exec_always sleep 1 && pkill -x swaybg
